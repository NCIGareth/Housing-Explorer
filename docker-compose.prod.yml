name: housing

x-build-common: &build-common
  context: .
  dockerfile: apps/web/Dockerfile
  args:
    NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set}
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set}
    NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}

services:
  # ---------- PostgreSQL + PostGIS (housing data) ----------
  db:
    image: imresamu/postgis:16-3.6-bookworm
    container_name: housing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: housing
      POSTGRES_USER: housing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - housing_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housing -d housing"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Nominatim (geocoding for PPR enrichment) ----------
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: housing-nominatim
    restart: unless-stopped
    shm_size: 2gb
    environment:
      PBF_URL: https://download.openstreetmap.fr/extracts/europe/ireland-latest.osm.pbf
      REPLICATION_URL: ""
      IMPORT_STYLE: full
      NOMINATIM_POSTGRESQL_SHARED_BUFFERS: 2GB
      NOMINATIM_POSTGRESQL_MAINTENANCE_WORK_MEM: 1GB
    volumes:
      - nominatim_data:/var/lib/postgresql/14/main
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/status || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 5400s

  # ---------- Next.js app ----------
  app:
    build:
      <<: *build-common
    image: housing-app
    container_name: housing-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
      DIRECT_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-dev}
      VERCEL_PROJECT_PRODUCTION_URL: ${SITE_URL:-https://housing.garethshaws.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DISPATCH_CRON_SECRET: ${DISPATCH_CRON_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------- One-off jobs (profiles:jobs, run manually) ----------
  #   docker compose --profile jobs run --rm migrate
  migrate:
    image: housing-tool
    build:
      <<: *build-common
      target: build
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
      DIRECT_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["pnpm", "--filter", "@housing/db", "exec", "prisma", "migrate", "deploy"]

  #   docker compose --profile jobs run --rm ingest
  ingest:
    image: housing-tool
    build:
      <<: *build-common
      target: build
    profiles: ["jobs"]
    environment:
      DATABASE_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
      DIRECT_URL: postgresql://housing:${POSTGRES_PASSWORD}@db:5432/housing?schema=public
      NOMINATIM_URL: http://nominatim:8080
    depends_on:
      db:
        condition: service_healthy
      nominatim:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "until node -e \"fetch('http://nominatim:8080/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"; do echo waiting for nominatim; sleep 30; done && pnpm db:download:ppr && pnpm ingest:ppr -- --since 2014 && pnpm ingest:enrich && pnpm ingest",
      ]

volumes:
  housing_db:
  nominatim_data:
